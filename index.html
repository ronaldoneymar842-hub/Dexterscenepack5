<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alperen</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.content {
  position: relative;
  z-index: 1;
  text-align: center;
  top: 50%;
  transform: translateY(-50%);
}

h1 {
  color: white;
  margin-bottom: 20px;
  font-size: 35px;
}

.btn {
  display: block;
  width: 250px;
  margin: 15px auto;
  padding: 15px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(5px);
  color: white;
  text-decoration: none;
  border-radius: 12px;
  transition: 0.3s;
}

.btn:hover {
  background: white;
  color: black;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
  <source src="edit.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">
  <h1>Alperen</h1>

  <a class="btn" href="#">Instagram</a>
  <a class="btn" href="#">YouTube</a>
  <a class="btn" href="#">TikTok</a>

</div>

</body>
  </html>
